name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and test
        run: |
          if [ ! -f package.json ]; then
            echo "Spec-only tree. M1 adds the npm workspaces; this job then builds and tests."
            exit 0
          fi
          npm ci
          npm run build
          npm test
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['test:ext'] ? 0 : 1)"; then
            xvfb-run -a npm run test:ext
          fi
