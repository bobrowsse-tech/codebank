name: Publish

# Cut a GitHub Release (tag vX.Y.Z matching packages/vscode/package.json) to
# attach the VSIX and publish the extension and the scoped CLI. A manual run
# can publish the CLI alone. The Marketplace step stays on the release event.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      npm_only:
        description: Publish the CLI to npm and skip Open VSX
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Require the extension package
        run: |
          if [ ! -f packages/vscode/package.json ]; then
            echo "::error::packages/vscode is not in this tree yet. Publish after the extension packages."
            exit 1
          fi

      - name: Install, test, and package
        run: |
          npm ci
          npm test
          npm run package

      - name: Check the release tag matches the extension version
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./packages/vscode/package.json').version")"
          tag="${{ github.event.release.tag_name }}"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Release tag $tag must be v$version to match packages/vscode/package.json."
            exit 1
          fi

      - name: Collect VSIX files
        id: vsix
        run: |
          mapfile -t files < <(find . -name '*.vsix' -not -path './node_modules/*' -not -path './.git/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::npm run package produced no .vsix file."
            exit 1
          fi
          printf '%s\n' "${files[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "**/*.vsix"
          if-no-files-found: error

      - name: Attach the VSIX to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find . -name '*.vsix' -not -path './node_modules/*' -not -path './.git/*' -print0 |
            xargs -0 gh release upload "${{ github.event.release.tag_name }}" --clobber

      - name: Publish to the Visual Studio Marketplace
        if: github.event_name == 'release'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Marketplace publishing is not configured."
            exit 1
          fi
          vsix="$(find . -name '*.vsix' -not -path './node_modules/*' -not -path './.git/*' -print -quit)"
          npx --yes @vscode/vsce publish --packagePath "$vsix" -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.npm_only != 'true')
        run: |
          vsix="$(find . -name '*.vsix' -not -path './node_modules/*' -not -path './.git/*' -print -quit)"
          npx --yes ovsx publish "$vsix" --trusted-publishing

      - name: Publish the scoped CLI to npm
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "npm publishing is not configured. Skipping npm."
            exit 0
          fi
          if [ ! -f packages/cli/package.json ]; then
            echo "packages/cli/package.json is missing. Skipping npm."
            exit 0
          fi
          set +e
          node <<'EOF'
          const pkg = require("./packages/cli/package.json");
          if (pkg.private) process.exit(10);
          if (!pkg.name || !pkg.name.startsWith("@")) {
            console.error(`Refusing to publish "${pkg.name || ""}". The unscoped name codebank is taken. Publish @bobrowsse-tech/codebank.`);
            process.exit(1);
          }
          EOF
          code=$?
          set -e
          if [ "$code" -eq 10 ]; then
            echo "CLI package is private. Skipping npm."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          npm publish --workspace packages/cli --access public
